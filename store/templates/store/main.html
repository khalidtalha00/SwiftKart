<!DOCTYPE html>
{% load static %}
<html>
<head>
	<title>SwiftKart</title>

	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1" />

	<!-- Google Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

	<link rel="stylesheet" type="text/css" href="{% static 'css/main.css' %}">

	<script type="text/javascript">
		var user = '{{request.user}}'

		function getToken(name) {
		    var cookieValue = null;
		    if (document.cookie && document.cookie !== '') {
		        var cookies = document.cookie.split(';');
		        for (var i = 0; i < cookies.length; i++) {
		            var cookie = cookies[i].trim();
		            // Does this cookie string begin with the name we want?
		            if (cookie.substring(0, name.length + 1) === (name + '=')) {
		                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
		                break;
		            }
		        }
		    }
		    return cookieValue;
		}
		var csrftoken = getToken('csrftoken')

		function getCookie(name) {
		    // Split cookie string and get all individual name=value pairs in an array
		    var cookieArr = document.cookie.split(";");

		    // Loop through the array elements
		    for(var i = 0; i < cookieArr.length; i++) {
		        var cookiePair = cookieArr[i].split("=");

		        /* Removing whitespace at the beginning of the cookie name
		        and compare it with the given string */
		        if(name == cookiePair[0].trim()) {
		            // Decode the cookie value and return
		            return decodeURIComponent(cookiePair[1]);
		        }
		    }

		    // Return null if not found
		    return null;
		}
		var cart = JSON.parse(getCookie('cart'))

		if (cart == undefined){
			cart = {}
			console.log('Cart Created!', cart)
			document.cookie ='cart=' + JSON.stringify(cart) + ";domain=;path=/"
		}
		console.log('Cart:', cart)
	
	</script>

</head>
<body>

	<nav class="navbar navbar-expand-lg sk-navbar" id="mainNavbar">

		<!-- Brand -->
		<a class="navbar-brand sk-brand" href="{% url 'store' %}">
			<span class="sk-brand-icon">⚡</span>
			SwiftKart
		</a>

		<!-- Mobile toggler -->
		<button class="navbar-toggler sk-toggler" type="button"
			data-toggle="collapse" data-target="#navbarSupportedContent"
			aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
			<span class="sk-toggler-bar"></span>
			<span class="sk-toggler-bar"></span>
			<span class="sk-toggler-bar"></span>
		</button>

		<div class="collapse navbar-collapse" id="navbarSupportedContent">

			<!-- Left links -->
			<ul class="navbar-nav mr-auto sk-nav-links">
				<li class="nav-item">
					<a class="nav-link sk-nav-link" href="{% url 'store' %}">Store</a>
				</li>
				<li class="nav-item">
					<a class="nav-link sk-nav-link" href="{% url 'admin:index' %}">Admin</a>
				</li>
			</ul>

			<!-- Right actions -->
			<div class="sk-nav-actions">

				{% if user.is_authenticated %}
					<!-- Profile avatar -->
					<a href="{% url 'profile' %}" class="sk-avatar-link" title="My Profile">
						<img src="{% static 'images/profile_icon.png' %}" alt="Profile" class="sk-avatar">
					</a>
					<!-- Logout -->
					<a href="{% url 'logout' %}" class="sk-btn sk-btn-logout">Logout</a>
				{% else %}
					<!-- Login -->
					<a href="{% url 'login' %}" class="sk-btn sk-btn-login">Login</a>
				{% endif %}

				<!-- Cart -->
				<a href="{% url 'cart' %}" class="sk-cart-link">
					<img id="cart-icon" src="{% static 'images/cart.png' %}" alt="Cart">
					<span id="cart-total">{{cartItems}}</span>
				</a>

			</div>
		</div>
	</nav>

	<script>
		// Add shadow to navbar on scroll
		window.addEventListener('scroll', function() {
			var nav = document.getElementById('mainNavbar');
			if (window.scrollY > 10) {
				nav.classList.add('sk-navbar-scrolled');
			} else {
				nav.classList.remove('sk-navbar-scrolled');
			}
		});
	</script>

     <div class="container">
            <br>
            {% block content %}


            {% endblock content %}
         </div>


	<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>

	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>

	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>

	<script type="text/javascript" src="{% static 'js/cart.js' %}"></script>
</body>
</html>
