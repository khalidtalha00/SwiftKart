{% extends 'store/Main.html' %}
{% load static %}

{% block content %}

<style>
  /* ── Auth Page Wrapper ── */
  .auth-wrapper {
    min-height: calc(100vh - 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  /* ── Card ── */
  .auth-card {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(79, 134, 140, 0.15);
    padding: 48px 44px;
    width: 100%;
    max-width: 440px;
    animation: slideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Header ── */
  .auth-card .auth-logo {
    text-align: center;
    margin-bottom: 28px;
  }

  .auth-card .auth-logo .logo-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 64px;
    height: 64px;
    border-radius: 18px;
    background: linear-gradient(135deg, #4f868c 0%, #2d6068 100%);
    margin-bottom: 14px;
    box-shadow: 0 8px 24px rgba(79, 134, 140, 0.35);
  }

  .auth-card .auth-logo .logo-icon svg {
    width: 32px;
    height: 32px;
    fill: #ffffff;
  }

  .auth-card h1.auth-title {
    font-size: 1.75rem;
    font-weight: 700;
    color: hsl(0, 0%, 15%);
    margin-bottom: 4px;
    text-align: center;
  }

  .auth-card p.auth-subtitle {
    font-size: 0.9rem;
    color: hsl(0, 0%, 55%);
    text-align: center;
    margin-bottom: 32px;
  }

  /* ── Alerts ── */
  .auth-alert {
    background: #fff0f0;
    border-left: 4px solid #e05252;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 20px;
    color: #c0392b;
    font-size: 0.875rem;
    font-weight: 500;
  }

  /* ── Form Fields ── */
  .auth-form-group {
    margin-bottom: 20px;
  }

  .auth-form-group label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: hsl(0, 0%, 35%);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .auth-form-group .input-wrapper {
    position: relative;
  }

  .auth-form-group .input-wrapper .input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #b0bec5;
    pointer-events: none;
  }

  .auth-form-group input {
    width: 100%;
    padding: 12px 14px 12px 42px;
    border: 2px solid hsl(0, 0%, 88%);
    border-radius: 12px;
    font-size: 0.95rem;
    color: hsl(0, 0%, 20%);
    background: hsl(0, 0%, 97%);
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    outline: none;
    box-sizing: border-box;
  }

  .auth-form-group input:focus {
    border-color: #4f868c;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(79, 134, 140, 0.12);
  }

  /* ── Submit Button ── */
  .auth-btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #4f868c 0%, #2d6068 100%);
    color: #ffffff;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    box-shadow: 0 6px 20px rgba(79, 134, 140, 0.35);
  }

  .auth-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(79, 134, 140, 0.45);
    opacity: 0.95;
  }

  .auth-btn:active {
    transform: translateY(0);
  }

  /* ── Footer Link ── */
  .auth-footer {
    text-align: center;
    margin-top: 24px;
    font-size: 0.9rem;
    color: hsl(0, 0%, 50%);
  }

  .auth-footer a {
    color: #4f868c;
    font-weight: 600;
    text-decoration: none;
    transition: color 0.2s;
  }

  .auth-footer a:hover {
    color: #2d6068;
    text-decoration: underline;
  }
</style>

<div class="auth-wrapper">
  <div class="auth-card">

    <!-- Logo / Icon -->
    <div class="auth-logo">
      <div class="logo-icon">
        <!-- Lock icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1C9.24 1 7 3.24 7 6v1H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2V6c0-2.76-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3v1H9V6c0-1.66 1.34-3 3-3zm0 9a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/>
        </svg>
      </div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your SwiftKart account</p>
    </div>

    <!-- Error Messages -->
    {% if messages %}
      {% for message in messages %}
        <div class="auth-alert">&#9888; {{ message }}</div>
      {% endfor %}
    {% endif %}

    <!-- Login Form -->
    <form method="POST" id="login-form">
      {% csrf_token %}

      <div class="auth-form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
          </span>
          <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>
      </div>

      <div class="auth-form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 1C9.24 1 7 3.24 7 6v1H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2V6c0-2.76-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3v1H9V6c0-1.66 1.34-3 3-3zm0 9a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/>
            </svg>
          </span>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
      </div>

      <button type="submit" class="auth-btn">Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="{% url 'register' %}">Create one</a>
    </div>

  </div>
</div>

{% endblock %}
